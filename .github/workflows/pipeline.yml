name: Pipeline de Testes ECLSS

on:
  push:
  pull_request:

jobs:
  testes:
    name: Pytest + Mocks + Selenium + BDD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Google Chrome (headless)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Executar a suíte completa com cobertura
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Publicar screenshots de falhas do Selenium
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-selenium
          path: screenshots/
          if-no-files-found: ignore
